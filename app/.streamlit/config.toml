[theme]
# Bank blue palette, shared with Z_SHARED_FUNCTIONS/FC_UI_STYLE.py.
# The stlite browser build (index.html) has no config.toml; it follows the OS
# theme instead, so FC_UI_STYLE also ships dark-mode overrides.
# No [server]/[browser] sections on purpose: those stay at defaults so the
# local server and any deployed page behave the same.
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"
